<!doctype html>
<meta charset="utf-8">
<title>NOIR project preview</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block}</style>
<iframe title="Generated website" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script>
  const preview = document.querySelector('iframe');
  addEventListener('message', event => {
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data?.type !== 'noir-preview' || typeof event.data.html !== 'string') return;
    preview.srcdoc = event.data.html;
  });
</script>
