<!doctype html>
<meta charset="utf-8">
<title>NOIR project preview</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block}</style>
<iframe title="Generated website" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script>
  const preview = document.querySelector('iframe');
  let projectId = null;
  let generation = 0;
  let storage = {};
  addEventListener('message', event => {
    if (event.source === preview.contentWindow && event.origin === 'null') {
      const update = event.data;
      if (update?.type !== 'noir-preview-storage' || update.generation !== generation ||
          typeof update.value !== 'string' || update.value.length > 16384) return;
      try {
        const value = JSON.parse(update.value);
        if (value && typeof value === 'object' && !Array.isArray(value) &&
            Object.values(value).every(item => typeof item === 'string')) storage = value;
      } catch {}
      return;
    }
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data?.type !== 'noir-preview' || typeof event.data.html !== 'string') return;
    if (event.data.projectId !== projectId) {
      projectId = event.data.projectId;
      storage = {};
    }
    const revision = ++generation;
    const snapshot = JSON.stringify(storage).replace(/</g, '\\u003c');
    // The sandboxed document has an opaque origin and no browser storage.
    // Keep a small, project-scoped store in the preview shell.
    const bridge = `<script>(() => {
      const items = new Map(Object.entries(${snapshot}));
      function commit(next) {
        const value = JSON.stringify(Object.fromEntries(next));
        if (value.length > 16384) throw new DOMException('Preview storage is full', 'QuotaExceededError');
        items.clear();
        for (const [key, entry] of next) items.set(key, entry);
        parent.postMessage({type:'noir-preview-storage',generation:${revision},value}, '*');
      }
      const local = {
        get length() { return items.size; },
        key: index => [...items.keys()][index] ?? null,
        getItem: key => items.get(String(key)) ?? null,
        setItem: (key, value) => commit(new Map(items).set(String(key), String(value))),
        removeItem: key => { const next = new Map(items); next.delete(String(key)); commit(next); },
        clear: () => commit(new Map())
      };
      Object.defineProperty(window, 'localStorage', { value: local });
      document.addEventListener('click', event => {
        const href = event.target.closest?.('a')?.getAttribute('href');
        if (event.defaultPrevented || !href?.startsWith('#')) return;
        event.preventDefault();
        if (href === '#') return window.scrollTo(0, 0);
        let id = href.slice(1);
        try { id = decodeURIComponent(id); } catch {}
        document.getElementById(id)?.scrollIntoView();
      });
    })();<\/script>`;
    const files = event.data.files || {};
    const asset = (name, mime) => {
      if (typeof files[name] !== 'string') return null;
      const bytes = new TextEncoder().encode(files[name]);
      return 'data:' + mime + ';base64,' + btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join(''));
    };
    const css = asset('styles.css', 'text/css');
    const js = asset('script.js', 'text/javascript');
    const html = event.data.html
      .replace(/<link\b[^>]*>/gi, tag => css ? tag.replace(/\bhref\s*=\s*(["'])(?:\.\/)?styles\.css\1/i, 'href="' + css + '"') : tag)
      .replace(/<script\b[^>]*>/gi, tag => js ? tag.replace(/\bsrc\s*=\s*(["'])(?:\.\/)?script\.js\1/i, 'src="' + js + '"') : tag);
    preview.srcdoc = html.replace(/^(\s*<!doctype html\s*>)(\s*<html\b[^>]*>)?(\s*<head\b[^>]*>)?/i,
      (match, doctype, root = '', head = '') => doctype + root + (head || '<head>') + bridge + (head ? '' : '</head>'));
  });
</script>
